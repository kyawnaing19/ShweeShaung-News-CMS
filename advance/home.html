<!DOCTYPE html>
<html>
<head>
  <title>Notification Demo</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>

<button id="viewTable">View Table</button>
<div id="tableData" style="display:none;"></div>

<script>
  $(document).ready(function() {

    function fetchAndDisplayRecords() {
      $.getJSON('fetchtable.php', function(data) {
        let tableHtml = '<table border="1"><tr><th>ID</th><th>Data</th></tr>';
        data.forEach(function(record) {
          tableHtml += `<tr><td>${record.email}</td><td>${record.order_at}</td></tr>`;
        });
        tableHtml += '</table>';
        $('#tableData').html(tableHtml).show();
      });
    }



    const userId = 1; // Example user ID. Securely obtain this in your application.

    function updateNotificationCount() {
      $.ajax({
        type: "POST",
        url: "getNewRecordsCount.php",
        data: { userId: userId },
        dataType: "json",
        success: function(response) {
          if (response.newRecordsCount > 0) {
            $('#viewTable').text(`View Table (${response.newRecordsCount} new)`);
          } else {
            $('#viewTable').text('View Table');
          }
        }
      });
    }

    $('#viewTable').click(function() {
      // Here, implement your logic to fetch and display the records in `#tableData`

      fetchAndDisplayRecords();
      $.ajax({
        type: "POST",
        url: "updateLastView.php",
        data: { userId: userId },
        success: function() {
          updateNotificationCount(); // Refresh the count after viewing
        }
      });
    });

    updateNotificationCount(); // Initial check for new records on page load
  });
</script>

</body>
</html>
