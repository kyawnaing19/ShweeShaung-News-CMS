<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Model Search</title>
    <style>
        .search-container {
            position: relative;
            width: 300px;
            margin: 50px auto;
        }

        #suggestionsContainer {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: #fff;
            border: 1px solid #ccc;
            display: none;
        }

        .suggestion {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
        }

        .suggestion:hover {
            background-color: #f2f2f2;
        }

    </style>
</head>
<body>
<div class="search-container">
    <input type="text" id="searchInput" placeholder="Enter phone model">
    <div id="suggestionsContainer"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script>
    $(document).ready(function() {
        var inputField = $('#searchInput');
        var suggestionsContainer = $('#suggestionsContainer');

        inputField.on('input', function() {
            var keyword = $(this).val().trim();

            if (keyword.length >= 3) {
                // Fetch suggestions from the server
                $.ajax({
                    url: 'search.php',
                    method: 'POST',
                    data: { keyword: keyword },
                    success: function(response) {
                        suggestionsContainer.html(response).show();
                    }
                });
            } else {
                suggestionsContainer.hide();
            }
        });

        // Handle suggestion click
        suggestionsContainer.on('click', '.suggestion', function() {
            inputField.val($(this).text());
            suggestionsContainer.hide();
        });

        // Hide suggestions on document click
        $(document).on('click', function(event) {
            if (!$(event.target).closest('.search-container').length) {
                suggestionsContainer.hide();
            }
        });
    });

</script>
</body>
</html>
